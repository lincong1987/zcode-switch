name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --lib
        working-directory: src-tauri

  check-portability:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        shell: bash
        run: |
          cd src-tauri
          cargo check --lib 2>&1 | tee check.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E '^error' check.log | head -6 | sed 's/^/::error:: /'
          fi
          exit $code
